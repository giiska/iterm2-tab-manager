[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iterm2-tab-manager"
version = "0.1.0"
description = "Utilities for managing iTerm2 tabs and sessions"
requires-python = ">=3.10"
dependencies = ["iterm2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
